version: '3.8'

services:
  # PostgreSQL 15 with PostGIS extension (for geospatial queries)
  postgres:
    image: postgis/postgis:15-3.4   # pre‑installed PostGIS
    environment:
      POSTGRES_USER: skilledsa_user
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: skilledsa_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Additional config if needed (e.g., shared_preload_libraries)
    # command: postgres -c shared_preload_libraries=postgis

  # Redis 7 for caching, rate limiting, and session storage
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # MinIO for local S3‑compatible storage (optional but useful)
  minio:
    image: minio/minio
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  minio_data: