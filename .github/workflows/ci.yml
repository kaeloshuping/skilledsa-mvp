name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]

env:
  NODE_VERSION: '20.11.x'

jobs:
  lint-and-test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # PostGIS-enabled image — the plain 'postgres:15' image lacks the
        # postgis extension required by the initial migration.
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: skilledsa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/skilledsa_test
      - run: npm run test:cov
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/skilledsa_test
          REDIS_URL: redis://localhost:6379
      - run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/skilledsa_test
          REDIS_URL: redis://localhost:6379
      # Fail only on critical vulnerabilities in production dependencies.
      # Dev-dependency vulnerabilities are excluded; aws-sdk v2 findings
      # are tracked for the AWS SDK v3 migration ticket.
      - run: npm audit --omit=dev --audit-level=critical

  lint-and-test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit